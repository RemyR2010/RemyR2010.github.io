<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .gallery-item {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        background: white;
      }

      .gallery-item:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      .gallery-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }

      .gallery-item figcaption {
        padding: 10px;
        text-align: center;
        font-weight: bold;
        color: #454545;
      }

      /* Responsive adjustments */
      @media (max-width: 600px) {
        .gallery {
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 10px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <h1>Photos</h1>
      <ul id="nav-ul">
        <li class="nav-li"><a href="index.html">Home</a></li>
        <li class="nav-li"><a href="portfolio.html">Portfolio</a></li>
        <li class="nav-li"><a href="images.html">Photos</a></li>
      </ul>
    </nav>

    <main>
      <div class="content">
        <h2>My Photo Gallery</h2>
        <div class="gallery">
          <figure class="gallery-item">
            <img src="assets/flower.JPG" alt="Flower" />
            <figcaption>Flower</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/Jesus.JPG" alt="Jesus" />
            <figcaption>Jesus</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/plane.JPG" alt="Plane" />
            <figcaption>Plane</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/seed.JPG" alt="Seed" />
            <figcaption>Seed</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/tunnel.JPG" alt="Tunnel" />
            <figcaption>Tunnel</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/tree.JPG" alt="Tree" />
            <figcaption>Tree</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/green.JPG" alt="Green" />
            <figcaption>Green</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/CHS.JPG" alt="CHS" />
            <figcaption>CHS</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/flag.JPG" alt="Flag" />
            <figcaption>Flag</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/bird.JPG" alt="Bird" />
            <figcaption>Bird</figcaption>
          </figure>
        </div>
      </div>
    </main>
  </body>
</html>
